spring.application.name=spring-ai-openai

# ============================================================
# SERVER CONFIGURATION
# ============================================================

# Spring Boot application will run on port 8081.
server.port=8081


# ============================================================
# SPRING AI CHAT CLIENT
# ============================================================

# Disable Spring AI's automatic ChatClient.Builder configuration.
#
# You are creating your own ChatClient beans manually inside:
#
#     AiConfig.java
#
# Therefore, you don't want Spring AI to automatically create
# the default ChatClient.Builder.
spring.ai.chat.client.enable=false


# ============================================================
# OPENAI CONFIGURATION
# ============================================================

# OpenAI API key.
#
# ${OPENAI_API_KEY} means:
#
# "Read the value from the environment variable
#  named OPENAI_API_KEY."
#
# DO NOT put the actual API key directly inside this file.
#
# Example environment variable:
#
# Windows PowerShell:
# $env:OPENAI_API_KEY="your-api-key"
#
spring.ai.openai.api-key=${OPENAI_API_KEY}


# OpenAI chat model that will be used.
#
# OpenAiChatModel will be configured using this model.
spring.ai.openai.chat.options.model=gpt-4o-mini


# Controls how deterministic/creative the OpenAI response is.
#
# Lower temperature:
#     More deterministic
#
# Higher temperature:
#     More variation/creativity
#
# 0.2 is relatively low.
spring.ai.openai.chat.options.temperature=0.2

spring.ai.openai.chat.options.max_tokens=1000
# ============================================================
# OLLAMA CONFIGURATION
# ============================================================

# URL where the local Ollama server is running.
#
# Default Ollama server:
#
#     http://localhost:11434
#
# Make sure Ollama is running before sending requests.
spring.ai.ollama.base-url=http://localhost:11434


# Ollama model to use.
#
# This tells Spring AI's OllamaChatModel which local
# Ollama model should process the request.
spring.ai.ollama.chat.options.model=codellama:latest


# Ollama response temperature.
#
# 0.7 allows more variation compared with the OpenAI
# temperature configured above.
spring.ai.ollama.chat.options.temperature=0.7